name: Build and test SURPS rulebook capabilities

on:
  push:
    branches: [development, master]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/books/**"
      - "docs/rulebook-backlog/**"
      - "docs/repository-participation.md"
      - "docs/repository-onboarding.md"
      - ".surps/rulebook-backlog.json"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/rulebook-owner-sign-in.yml"
      - ".github/ISSUE_TEMPLATE/surps-repository-participation.yml"
      - "docs/assets/rulebook-lod-*.svg"
      - ".surps/participation.json"
      - ".surps/contributions/**"
      - "docs/book-contribution-contract.md"
      - "scripts/validate_surps_catalog.py"
      - "scripts/validate_surps_book_schemas.py"
      - "scripts/generate_surps_book_assets.py"
      - "schemas/**"
      - "docs/examples/**"
      - "SURPS.sln"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for SURPS content validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install JSON Schema validator
        run: python -m pip install "jsonschema>=4.23,<5"
      - name: Validate SURPS book contribution and experience schemas
        run: python scripts/validate_surps_book_schemas.py
      - name: Validate SURPS book catalogue and descriptors
        run: python3 scripts/validate_surps_catalog.py
      - name: Verify generated SURPS publication assets
        run: python3 scripts/generate_surps_book_assets.py --check
      - name: Checkout MicroBundleDomain development dependency
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: _dependencies/MicroBundleDomain
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and pack MicroBundleDomain development dependency
        run: |
          dotnet restore _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj
          dotnet build _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj --configuration Release --no-restore
          mkdir -p _dependencies/nuget
          dotnet pack _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj --configuration Release --no-build --output _dependencies/nuget
      - name: Restore
        run: dotnet restore SURPS.sln --source "$GITHUB_WORKSPACE/_dependencies/nuget" --source https://api.nuget.org/v3/index.json
      - name: Build
        run: dotnet build SURPS.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SURPS.sln --configuration Release --no-build --logger "trx;LogFileName=surps-tests.trx"
      - name: Pack MicroBundle artifact (no publication)
        run: dotnet pack src/TheSingularityWorkshop.SURPS.Rulebook.DungeonsAndUnderground/TheSingularityWorkshop.SURPS.Rulebook.DungeonsAndUnderground.csproj --configuration Release --no-build --output ./artifacts
      - name: Upload MicroBundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: surps-rulebook-dungeons-and-underground
          path: ./artifacts/*.nupkg
          if-no-files-found: error
