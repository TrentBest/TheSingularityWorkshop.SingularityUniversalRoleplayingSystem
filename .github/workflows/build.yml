name: Build and test SURPS rulebook capabilities

on:
  push:
    branches: [development, master]
    paths:
      - "src/**"
      - "tests/**"
      - "SURPS.sln"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SURPS.sln
      - name: Build
        run: dotnet build SURPS.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SURPS.sln --configuration Release --no-build --logger "trx;LogFileName=surps-tests.trx"
