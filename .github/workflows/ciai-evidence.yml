name: CiAi SURPS Evidence

on:
  push:
    branches: [development]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character SURPS commit SHA to observe"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ciai-surps-evidence-${{ github.event.inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe exact SURPS CI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve target commit
        id: target
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          target="${INPUT_SHA:-$GITHUB_SHA}"
          if ! [[ "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Target must be a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=${target,,}" >> "$GITHUB_OUTPUT"

      - name: Check out exact SURPS target commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: TrentBest/TheSingularityWorkshop.SingularityUniversalRoleplayingSystem
          ref: ${{ steps.target.outputs.sha }}
          path: _target/SURPS
          persist-credentials: false

      - name: Resolve exact authoritative Pages workflow run
        id: source-run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          matching="[]"
          for poll in $(seq 1 30); do
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?head_sha=$TARGET_SHA&branch=development&event=push&per_page=100")"
            matching="$(jq --arg repo "$GITHUB_REPOSITORY" --arg sha "$TARGET_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(.path | split("@")[0] == ".github/workflows/pages.yml")
                | select(.event == "push" and .head_branch == "development")
                | select(.head_repository.full_name == $repo)]
            ' <<< "$response")"
            count="$(jq 'length' <<< "$matching")"
            if [ "$count" -gt 1 ]; then
              echo "::warning::Multiple matching Pages runs exist; preserving ambiguity."
              break
            fi
            if [ "$count" -eq 1 ] && [ "$(jq -r '.[0].status' <<< "$matching")" = "completed" ]; then
              break
            fi
            sleep 10
          done

          count="$(jq 'length' <<< "$matching")"
          if [ "$count" -eq 1 ]; then
            run_id="$(jq -r '.[0].id' <<< "$matching")"
            attempt="$(jq -r '.[0].run_attempt' <<< "$matching")"
            status="$(jq -r '.[0].status' <<< "$matching")"
            conclusion="$(jq -r '.[0].conclusion // "none"' <<< "$matching")"
            url="$(jq -r '.[0].html_url' <<< "$matching")"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
            echo "required_workflow=.github/workflows/pages.yml#$run_id#$attempt" >> "$GITHUB_OUTPUT"
            echo "source_run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "source_run_attempt=$attempt" >> "$GITHUB_OUTPUT"
            echo "source_run_status=$status" >> "$GITHUB_OUTPUT"
            echo "source_run_conclusion=$conclusion" >> "$GITHUB_OUTPUT"
            echo "source_run_url=$url" >> "$GITHUB_OUTPUT"
          else
            if [ "$count" -gt 1 ]; then state="ambiguous"; else state="missing-or-not-yet-created"; fi
            echo "required_workflow=.github/workflows/pages.yml" >> "$GITHUB_OUTPUT"
            echo "source_run_id=" >> "$GITHUB_OUTPUT"
            echo "source_run_attempt=" >> "$GITHUB_OUTPUT"
            echo "source_run_status=$state" >> "$GITHUB_OUTPUT"
            echo "source_run_conclusion=$state" >> "$GITHUB_OUTPUT"
            echo "source_run_url=" >> "$GITHUB_OUTPUT"
            echo "::warning::No unique completed Pages run was resolved; CiAi will retain the missing/ambiguous workflow evidence."
          fi

      - name: Check out pinned CiAi observer source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: 66af59177bbe67275915a4e11fd66ee05166fb6a
          path: _tools/CiAi
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x

      - name: Restore pinned CiAi observer
        working-directory: _tools/CiAi
        run: dotnet restore samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj

      - name: Build pinned CiAi observer
        working-directory: _tools/CiAi
        run: dotnet build samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj --configuration Release --no-restore

      - name: Validate exact-commit SURPS onboarding with CiAi v1
        id: admission
        working-directory: _tools/CiAi
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SURPS_ONBOARDING: ${{ github.workspace }}/_target/SURPS/AgentOnboarding.md
        shell: bash
        run: |
          set -euo pipefail
          admission_dir="$RUNNER_TEMP/surps-admission"
          mkdir -p "$admission_dir"
          cat > "$admission_dir/SurpsAdmission.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/_tools/CiAi/src/TheSingularityWorkshop.CiAi/TheSingularityWorkshop.CiAi.csproj" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$admission_dir/Program.cs" <<'EOF'
          using System.Text;
          using System.Text.Json;
          using TheSingularityWorkshop.CiAi;

          var repository = "TrentBest/TheSingularityWorkshop.SingularityUniversalRoleplayingSystem";
          var sha = args[0];
          var content = new UTF8Encoding(false, true).GetString(File.ReadAllBytes(args[1]));
          var observation = new AgentOnboardingSourceObservation(
              repository, sha, sha, AgentOnboardingValidator.RequiredPath,
              AgentOnboardingReadStatus.Available, content);
          var result = AgentOnboardingValidator.Evaluate(observation);
          Console.WriteLine(JsonSerializer.Serialize(result, new JsonSerializerOptions { WriteIndented = true }));
          return result.IsEligible ? 0 : 1;
          EOF
          dotnet run --project "$admission_dir/SurpsAdmission.csproj" --configuration Release -- "$TARGET_SHA" "$SURPS_ONBOARDING" | tee "$RUNNER_TEMP/surps-admission-result.json"
          jq -e '.IsEligible == true and .Outcome == "ELIGIBLE" and .RequestedCommitSha == "'"$TARGET_SHA"'" and .ContentSha256 != null' "$RUNNER_TEMP/surps-admission-result.json" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/_tools/CiAi/artifacts"
          cp "$RUNNER_TEMP/surps-admission-result.json" "$GITHUB_WORKSPACE/_tools/CiAi/artifacts/ciai-surps-onboarding-admission.json"
          digest="$(jq -r '.ContentSha256' "$RUNNER_TEMP/surps-admission-result.json")"
          echo "CiAi AgentOnboarding v1 admission: ELIGIBLE at exact commit $TARGET_SHA (SHA-256: $digest)." >> "$GITHUB_STEP_SUMMARY"

      - name: Observe exact SURPS commit with CiAi
        id: observe
        working-directory: _tools/CiAi
        env:
          CIAI_GITHUB_TOKEN: ${{ github.token }}
          CIAI_REQUIRED_WORKFLOW_PATHS: ${{ steps.source-run.outputs.required_workflow }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          dotnet run --project samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release --no-build -- \
            "TrentBest/TheSingularityWorkshop.SingularityUniversalRoleplayingSystem" "$TARGET_SHA" artifacts/ciai-surps-evidence.json
          result=$?
          set -e
          echo "observer_exit_code=$result" >> "$GITHUB_OUTPUT"
          echo "CiAi observer exit code: $result (evidence result is advisory; GitHub Actions remains authoritative)."

      - name: Validate report identity and schema
        working-directory: _tools/CiAi
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REQUIRED_WORKFLOW: ${{ steps.source-run.outputs.required_workflow }}
        shell: bash
        run: |
          set -euo pipefail
          report="artifacts/ciai-surps-evidence.json"
          test -s "$report"
          jq -e --arg sha "$TARGET_SHA" --arg workflow "$REQUIRED_WORKFLOW" '
            .schema == "ciai.commit-observation.v2" and
            .reportType == "read-only-workflow-observation" and
            .repository == "TrentBest/TheSingularityWorkshop.SingularityUniversalRoleplayingSystem" and
            .headSha == $sha and
            .requiredWorkflowPolicy.configured == true and
            (.requiredWorkflowResults | length) == 1 and
            .requiredWorkflowResults[0].WorkflowPath == $workflow
          ' "$report" >/dev/null

      - name: Publish evidence summary
        if: always()
        working-directory: _tools/CiAi
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SOURCE_RUN_URL: ${{ steps.source-run.outputs.source_run_url }}
          SOURCE_RUN_ID: ${{ steps.source-run.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source-run.outputs.source_run_attempt }}
          SOURCE_RUN_STATUS: ${{ steps.source-run.outputs.source_run_status }}
          SOURCE_RUN_CONCLUSION: ${{ steps.source-run.outputs.source_run_conclusion }}
          REQUIRED_WORKFLOW: ${{ steps.source-run.outputs.required_workflow }}
          OBSERVER_EXIT_CODE: ${{ steps.observe.outputs.observer_exit_code }}
        shell: bash
        run: |
          report="artifacts/ciai-surps-evidence.json"
          policy_state="not-produced"
          if [ -s "$report" ]; then
            policy_state="$(jq -r '.requiredWorkflowResults[0].State // "unknown"' "$report")"
          fi
          {
            echo "## CiAi — SURPS exact commit evidence"
            echo
            echo "- Repository: TrentBest/TheSingularityWorkshop.SingularityUniversalRoleplayingSystem"
            echo "- Exact source commit: $TARGET_SHA"
            echo "- Required workflow selector: $REQUIRED_WORKFLOW"
            echo "- Authoritative Pages run: ${SOURCE_RUN_URL:-not uniquely resolved}"
            echo "- Run ID / attempt: ${SOURCE_RUN_ID:-unknown} / ${SOURCE_RUN_ATTEMPT:-unknown}"
            echo "- Provider status / conclusion: $SOURCE_RUN_STATUS / $SOURCE_RUN_CONCLUSION"
            echo "- CiAi policy state: $policy_state"
            echo "- CiAi observer exit code: ${OBSERVER_EXIT_CODE:-not run}"
            echo
            echo "Read-only evidence only. Pages deployment, source validation, merge, package publication, and release remain separate concerns and approval gates."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CiAi evidence report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: CiAi-SURPS-evidence-${{ steps.target.outputs.sha }}
          path: |
            _tools/CiAi/artifacts/ciai-surps-evidence.json
            _tools/CiAi/artifacts/ciai-surps-evidence.md
            _tools/CiAi/artifacts/ciai-surps-onboarding-admission.json
          if-no-files-found: warn
          retention-days: 30
