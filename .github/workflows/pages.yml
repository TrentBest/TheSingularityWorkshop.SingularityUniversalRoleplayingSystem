name: Publish SURPS site

on:
  push:
    branches: [master, development]
    paths:
      - 'docs/**'
      - 'schemas/**'
      - 'README.md'
      - 'AgentOnboarding.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/ciai-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage public schemas for the documentation site
        run: |
          mkdir -p docs/schemas
          cp schemas/*.schema.json docs/schemas/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
