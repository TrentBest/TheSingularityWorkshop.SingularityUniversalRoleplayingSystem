name: Publish SURPS site

on:
  push:
    branches: [master, development]
    paths:
      - 'docs/**'
      - 'samples/SurpsGuiSvg/**'
      - '.surps/participation.json'
      - 'scripts/generate_surps_book_assets.py'
      - 'schemas/**'
      - 'README.md'
      - 'AgentOnboarding.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/ciai-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SURPS
        uses: actions/checkout@v4
      - name: Checkout GUI development source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: dependencies/GUI
          token: ${{ github.token }}
      - name: Set up Python for publication generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up .NET for GUI.SVG publication
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate opted-in SURPS publication assets
        run: python scripts/generate_surps_book_assets.py
      - name: Generate SURPS living diagram through GUI.Core and GUI.SVG
        run: dotnet run --project samples/SurpsGuiSvg/SurpsGuiSvg.csproj --configuration Release
      - name: Stage public schemas for the documentation site
        run: |
          mkdir -p docs/schemas
          cp schemas/*.schema.json docs/schemas/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
