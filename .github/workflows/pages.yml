name: Publish SURPS site

on:
  push:
    branches: [master, development]
    paths:
      - 'docs/**'
      - 'samples/SurpsGuiSvg/**'
      - '.surps/participation.json'
      - '.surps/microbundles/**'
      - 'scripts/generate_surps_book_assets.py'
      - 'scripts/generate_surps_character_catalog.py'
      - 'schemas/**'
      - 'README.md'
      - 'AgentOnboarding.md'
      - '.github/workflows/pages.yml'
      - '.github/workflows/ciai-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SURPS
        uses: actions/checkout@v4
      - name: Checkout GUI development source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: dependencies/GUI
          token: ${{ github.token }}
      - name: Checkout Visualize development source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.Visualize
          ref: development
          path: dependencies/Visualize
          token: ${{ github.token }}
      - name: Checkout Visualize FSM_API development dependency
        uses: actions/checkout@v4
        with:
          repository: TrentBest/FSM_API
          ref: development
          path: dependencies/Visualize/FSM_API
          token: ${{ github.token }}
      - name: Checkout Visualize ProtocolAi development dependency
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.ProtocolAi
          ref: development
          path: dependencies/Visualize/TheSingularityWorkshop.ProtocolAi
          token: ${{ github.token }}
      - name: Checkout Visualize MicroBundleDomain development dependency
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: dependencies/Visualize/TheSingularityWorkshop.MicroBundleDomain
          token: ${{ github.token }}
      - name: Set up Python for publication generation
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate SURPS character picker catalog from registered MicroBundles
        run: python scripts/generate_surps_character_catalog.py
      - name: Validate character sheet SVG catalog and studio integration
        run: python tests/python/test_character_sheet_assets.py
      - name: Set up .NET for GUI.SVG publication
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate opted-in SURPS publication assets
        run: python scripts/generate_surps_book_assets.py
      - name: Generate SURPS living diagram through GUI.Core and GUI.SVG
        run: dotnet run --project samples/SurpsGuiSvg/SurpsGuiSvg.csproj --configuration Release
      - name: Generate SURPS tactical map through Visualize
        env:
          WorkshopUseFsmApiRepositorySource: "true"
          WorkshopSourceRoot: ${{ github.workspace }}/dependencies/Visualize
        run: |
          mkdir -p docs/assets/generated
          dotnet run --project dependencies/Visualize/samples/TacticalMapProof/TacticalMapProof.csproj --configuration Release -- docs/assets/generated/visualize-tactical-map
          cp docs/assets/generated/visualize-tactical-map/tactical-map.svg docs/assets/generated/surps-tactical-map.svg
          cp docs/assets/generated/visualize-tactical-map/tactical-map-manifest.json docs/assets/generated/surps-tactical-map-manifest.json
      - name: Stage public schemas for the documentation site
        run: |
          mkdir -p docs/schemas
          cp schemas/*.schema.json docs/schemas/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
