<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Living settlement SVG scaffold</title><desc id="desc">A non-authoritative visual preview showing a flowing river, a road with tiny travelers, a town, and an active shop with a keeper and customers.</desc>
<defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#7bc8e8"/><stop offset="1" stop-color="#2879ad"/></linearGradient><pattern id="grass" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="1.5" fill="#6c9c58" opacity=".5"/><circle cx="24" cy="22" r="1" fill="#6c9c58" opacity=".4"/></pattern><style>text{font-family:Georgia,serif;fill:#263b31}.label{font:14px Arial,sans-serif;letter-spacing:2px}.tiny{font:10px Arial,sans-serif}.traveler{fill:#9b4e2f;stroke:#fff;stroke-width:1.5}.person{transform-box:fill-box;transform-origin:center;animation:walk 1s ease-in-out infinite alternate}@keyframes walk{to{transform:translateY(-3px) rotate(4deg)}}.customer{animation:arrive 9s ease-in-out infinite alternate}@keyframes arrive{from{transform:translate(0,0)}to{transform:translate(26px,-4px)}}.waterline{stroke:#d5f6ff;stroke-width:3;stroke-linecap:round;stroke-dasharray:12 18;animation:flow 2s linear infinite}@keyframes flow{to{stroke-dashoffset:-60}}.smoke{fill:none;stroke:#fff;stroke-width:3;opacity:.7;stroke-dasharray:4 7;animation:rise 5s linear infinite}@keyframes rise{to{transform:translateY(-18px);opacity:0}}</style></defs>
