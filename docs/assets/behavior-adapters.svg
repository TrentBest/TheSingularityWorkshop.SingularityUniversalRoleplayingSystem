<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">One behavior model, two adapters</title><desc id="d">An authored behavior model is calibrated and compiled into tabletop and digital adapters that lead into a shared experience.</desc><rect width="1000" height="430" rx="24" fill="#101923"/><g fill="#1b3b42" stroke="#85ddc6" stroke-width="2"><rect x="330" y="28" width="340" height="90" rx="18"/><rect x="330" y="160" width="340" height="75" rx="18"/><rect x="75" y="295" width="350" height="90" rx="18"/><rect x="575" y="295" width="350" height="90" rx="18"/></g><g stroke="#f0ca7b" stroke-width="4" fill="none"><path d="M500 118 V160 M500 235 V265 H250 V295 M500 265 H750 V295"/><path d="M242 277 l8 18 8 -18 M742 277 l8 18 8 -18"/></g><g fill="#edf4f8" font-family="system-ui" text-anchor="middle"><text x="500" y="65" font-size="23" font-weight="700">Authored behavior model</text><text x="500" y="91" font-size="14">world · entities · capabilities · interactions</text><text x="500" y="190" font-size="19" font-weight="700">Workshop calibration + compilation</text><text x="500" y="215" font-size="13">validate · simulate · derive · version</text><text x="250" y="330" font-size="22" font-weight="700">Tabletop adapter</text><text x="250" y="356" font-size="14">human-scale procedure · derived aids</text><text x="750" y="330" font-size="22" font-weight="700">Digital adapter</text><text x="750" y="356" font-size="14">compiled behavior · live state</text></g><g fill="#f0ca7b"><circle cx="500" cy="118" r="6"/><circle cx="500" cy="235" r="6"/></g><text x="500" y="414" fill="#a8bbc8" font-family="system-ui" font-size="13" text-anchor="middle">Different views. Same authored semantics. No separate source of truth.</text></svg>