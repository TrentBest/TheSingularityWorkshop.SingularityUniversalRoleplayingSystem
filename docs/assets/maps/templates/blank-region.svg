<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Blank region map template</title><desc id="desc">An empty regional map with terrain placement guides, a scale reference, and room for routes and settlements.</desc>
<defs><pattern id="region-grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#b6c9bd" stroke-opacity=".13"/></pattern><linearGradient id="land" x2="1" y2="1"><stop stop-color="#344c48"/><stop offset="1" stop-color="#1c3037"/></linearGradient></defs>
<rect width="1200" height="900" fill="url(#land)"/><rect width="1200" height="900" fill="url(#region-grid)"/>
<g fill="none" stroke="#c6d7c9" stroke-opacity=".2"><path d="M0 300Q260 220 480 330T900 300T1200 250M0 650Q260 560 520 670T930 620T1200 700"/><path d="M300 0Q380 240 300 450T340 900M850 0Q760 230 850 460T820 900"/></g>
<g fill="#e0e9df" fill-opacity=".6" font-family="system-ui,sans-serif"><text x="30" y="42" font-size="17">REGION CANVAS · EMPTY TEMPLATE</text><text x="30" y="872" font-size="12">Terrain, routes, settlements, and child-map anchors are authored separately.</text></g>
<path d="M1040 820h100m-100 -6v12m100 -12v12" stroke="#e0e9df" stroke-width="2"/><text x="1090" y="805" fill="#e0e9df" font-size="12" text-anchor="middle">SCALE</text>
