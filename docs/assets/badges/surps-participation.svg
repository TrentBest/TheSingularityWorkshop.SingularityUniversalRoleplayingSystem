<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 154" role="img" aria-labelledby="title desc">
  <title id="title">SURPS participant — six sourcebook outputs</title>
  <desc id="desc">The Singularity Workshop SURPS participant badge. Six draft sourcebooks are currently catalogued: Dwarves CORE level 0, Spying CORE level 0, Dungeons and Underground level 1, Dwarves level 1, Dwarven Strongholds level 2, and NPCs in Play level 1.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182536"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bd5ca"/>
      <stop offset="1" stop-color="#78a9d4"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="1036" height="150" rx="18" fill="url(#panel)" stroke="#577082" stroke-width="2"/>
  <rect x="18" y="18" width="8" height="118" rx="4" fill="url(#accent)"/>
  <text x="48" y="55" fill="#f2f6f8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="1.5">SURPS PARTICIPANT</text>
  <text x="48" y="83" fill="#a9c2d0" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="1.1">SOURCEBOOK CATALOGUE · ALL SIX OUTPUTS ARE DRAFT</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#f1f5f7">
    <rect x="48" y="101" width="150" height="34" rx="8" fill="#294454"/><text x="61" y="124">Dwarves · CORE 0</text>
    <rect x="208" y="101" width="132" height="34" rx="8" fill="#294454"/><text x="222" y="124">Spying · CORE 0</text>
    <rect x="350" y="101" width="236" height="34" rx="8" fill="#294454"/><text x="364" y="124">Dungeons · LOD 1</text>
    <rect x="596" y="101" width="144" height="34" rx="8" fill="#294454"/><text x="610" y="124">Dwarves · LOD 1</text>
    <rect x="750" y="101" width="172" height="34" rx="8" fill="#294454"/><text x="764" y="124">Strongholds · LOD 2</text>
    <rect x="932" y="101" width="92" height="34" rx="8" fill="#294454"/><text x="943" y="124">NPCs · 1</text>
  </g>
</svg>
