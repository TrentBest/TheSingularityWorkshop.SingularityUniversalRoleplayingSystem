<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">A living cross-section of an underground world</title>
<desc id="desc">An animated geological cross-section shows surface, layered rock, a cave chamber, a water-bearing fracture, a constructed tunnel, and a deep mineral seam. Labels identify that formation, construction, and later occupation leave different evidence.</desc>
<style>
  text{font-family:system-ui,sans-serif;fill:#eaf1f5}.label{font-size:16px;font-weight:650}.small{font-size:12px;fill:#c6d4dc}.rock{stroke:#c2a77c;stroke-width:2}.flow{stroke:#76d8e8;stroke-width:4;stroke-linecap:round;stroke-dasharray:8 13;animation:flow 5s linear infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-84}}@keyframes pulse{50%{opacity:.35;transform:scale(.96)}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
</style>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#1a3039"/><stop offset="1" stop-color="#101820"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#4fb8ce" stop-opacity=".75"/><stop offset="1" stop-color="#22637a" stop-opacity=".9"/></linearGradient>
 <pattern id="grain" width="24" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1.3" fill="#ead6a8" opacity=".25"/><circle cx="18" cy="13" r="1" fill="#ead6a8" opacity=".18"/></pattern>
</defs>
<rect width="900" height="440" rx="20" fill="url(#bg)"/>
<path d="M0 112 Q120 86 225 111 T450 103 T680 108 T900 92 V440 H0Z" fill="#536c4d"/>
<path d="M0 142 Q140 126 260 148 T510 140 T720 145 T900 128 V440 H0Z" fill="#78634a" class="rock"/>
<path d="M0 216 Q150 193 300 218 T600 205 T900 220 V440 H0Z" fill="#5d5660" class="rock"/>
<path d="M0 294 Q150 270 310 300 T620 282 T900 305 V440 H0Z" fill="#343f4b" class="rock"/>
<path d="M0 142 Q140 126 260 148 T510 140 T720 145 T900 128 V440 H0Z" fill="url(#grain)"/>
<path d="M0 112 Q120 86 225 111 T450 103 T680 108 T900 92" fill="none" stroke="#b4d08b" stroke-width="4"/>
<!-- natural chamber -->
<path d="M180 244 Q210 202 262 226 Q292 195 337 229 Q379 209 408 251 Q392 286 350 291 Q304 311 262 289 Q213 298 180 244Z" fill="#101820" stroke="#d4bd92" stroke-width="4"/>
<path d="M212 249 Q248 228 275 246 Q310 223 345 251" fill="none" stroke="#a2b4b6" stroke-width="2" opacity=".55"/>
<!-- constructed tunnel -->
<path d="M535 292 V258 Q535 224 573 224 H704 Q742 224 742 258 V292Z" fill="#111a22" stroke="#d9b98b" stroke-width="7"/>
<path d="M545 284 V260 Q545 235 574 235 H703 Q731 235 731 260 V284" fill="none" stroke="#8e7861" stroke-width="3" stroke-dasharray="9 5"/>
<!-- fracture and water -->
<path d="M455 116 L431 174 L452 207 L423 250 L445 289" fill="none" stroke="#b5d7dd" stroke-width="5" opacity=".75"/>
<path d="M452 207 L423 250 L445 289" class="flow"/>
<path d="M395 302 Q430 284 465 302 T535 300 L535 318 Q465 328 395 317Z" fill="url(#water)" class="pulse"/>
<!-- mineral seam -->
<path d="M120 359 Q250 331 365 360 T610 359 T820 350" fill="none" stroke="#e8bd6b" stroke-width="9" stroke-linecap="round"/>
<path d="M120 359 Q250 331 365 360 T610 359 T820 350" fill="none" stroke="#fff0b0" stroke-width="2" stroke-dasharray="3 10"/>
<!-- callouts -->
<g><path d="M90 76 L150 108" stroke="#d7e3dc" stroke-width="1.5"/><text x="28" y="55" class="label">Surface</text><text x="28" y="73" class="small">entry and weathering</text></g>
<g><path d="M288 177 L288 218" stroke="#d7e3dc" stroke-width="1.5"/><text x="240" y="160" class="label">Natural chamber</text><text x="240" y="177" class="small">fracture + erosion</text></g>
<g><path d="M485 168 L450 211" stroke="#d7e3dc" stroke-width="1.5"/><text x="480" y="150" class="label">Water-bearing fracture</text><text x="480" y="168" class="small">flow follows pressure and structure</text></g>
<g><path d="M642 184 L642 225" stroke="#d7e3dc" stroke-width="1.5"/><text x="590" y="165" class="label">Constructed passage</text><text x="590" y="183" class="small">excavation and reinforcement</text></g>
<g><path d="M730 383 L700 357" stroke="#d7e3dc" stroke-width="1.5"/><text x="735" y="390" class="label">Mineral seam</text><text x="735" y="408" class="small">deposit with provenance</text></g>
<text x="26" y="414" class="small">Conceptual cross-section · not to scale · illustrative domain model</text>
</svg>