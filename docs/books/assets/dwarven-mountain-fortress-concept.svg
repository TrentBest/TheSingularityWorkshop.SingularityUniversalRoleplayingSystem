<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual cutaway of the Dwarven Mountain Fortress</title>
  <desc id="desc">A schematic mountain cross-section showing an exterior ridge, geological layers, a high gate, great hall, foundry, delving works, reservoir, natural root halls, and a sealed lower dark. This is a design illustration, not a generated physical mountain volume or a playable map.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#182d40"/><stop offset="1" stop-color="#283747"/></linearGradient>
    <linearGradient id="rock" x2="0" y2="1"><stop stop-color="#68717a"/><stop offset=".45" stop-color="#454b54"/><stop offset="1" stop-color="#262b35"/></linearGradient>
    <linearGradient id="deep" x2="0" y2="1"><stop stop-color="#222b38"/><stop offset="1" stop-color="#111722"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:system-ui,sans-serif;fill:#f2eee7}
      .label{font-size:19px;font-weight:700}
      .sub{font-size:13px;fill:#c5cbd1}
      .fine{font-size:12px;fill:#b7c1ca}
      .hall{fill:#28313d;stroke:#d6b17b;stroke-width:3}
      .route{fill:none;stroke:#d9b77f;stroke-width:7;stroke-linecap:round;stroke-dasharray:12 10}
      .ore{fill:none;stroke:#c77d54;stroke-width:12;stroke-linecap:round;stroke-dasharray:3 8}
      .water{fill:none;stroke:#55b8d2;stroke-width:8;stroke-linecap:round;stroke-dasharray:16 12}
      .beam{stroke:#c9a878;stroke-width:10;stroke-linecap:round}
      .outline{fill:none;stroke:#aeb6bd;stroke-width:2;opacity:.5}
      @media(prefers-reduced-motion:no-preference){.water{animation:flow 5s linear infinite}.lift{animation:lift 6s ease-in-out infinite}.forge{animation:flicker 2.4s ease-in-out infinite alternate}}
      @keyframes flow{to{stroke-dashoffset:-56}}
      @keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
      @keyframes flicker{from{opacity:.65}to{opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#sky)"/>
  <path d="M0 210 L120 190 240 118 330 150 445 48 555 125 670 82 790 170 920 105 1030 162 1200 140 L1200 760 0 760Z" fill="url(#rock)" stroke="#9aa2a8" stroke-width="4"/>
  <path d="M0 340 Q250 270 430 310 T800 300 T1200 275" class="outline"/>
  <path d="M0 455 Q260 390 500 440 T950 420 T1200 390" class="outline"/>
  <path d="M0 590 Q250 520 500 565 T950 540 T1200 520" class="outline"/>
  <path d="M35 285 Q210 240 390 275 T760 260 T1160 230" fill="none" stroke="#aab7a4" stroke-width="4" opacity=".45"/>
  <text x="44" y="52" class="label">THE MOUNTAIN</text><text x="44" y="76" class="sub">Exterior terrain and solid geology · Physics-owned</text>
  <path d="M210 222 L255 330 L330 380 L440 382 L510 430 L615 430 L675 470 L810 470 L885 535 L1005 535" fill="none" stroke="#141a23" stroke-width="40" stroke-linecap="round"/>
  <path d="M210 222 L255 330 L330 380 L440 382 L510 430 L615 430 L675 470 L810 470 L885 535 L1005 535" class="route"/>
  <g>
    <path d="M178 270 Q210 220 245 270 L245 330 L178 330Z" class="hall"/>
    <rect x="188" y="286" width="46" height="44" fill="#121923" stroke="#d6b17b" stroke-width="2"/>
    <text x="120" y="355" class="label">HIGH GATE</text><text x="120" y="376" class="sub">Switchback entrance</text>
  </g>
  <g>
    <path d="M320 365 Q365 300 430 365 L430 422 L320 422Z" class="hall"/>
    <path d="M342 420 V372 Q375 325 408 372 V420" fill="#151c27" stroke="#d6b17b" stroke-width="3"/>
    <text x="300" y="455" class="label">GREAT HALL</text><text x="300" y="476" class="sub">Civic heart · assembly · memory</text>
  </g>
  <g>
    <path d="M500 414 L565 414 L590 450 L590 510 L500 510Z" class="hall"/>
    <path d="M520 490 L520 450 L565 450 L565 490" fill="#141b25" stroke="#d6b17b" stroke-width="3"/>
    <circle cx="545" cy="478" r="22" fill="#e48b43" class="forge" filter="url(#glow)"/>
    <text x="480" y="545" class="label">DEEP FOUNDRY</text><text x="480" y="566" class="sub">Heat · fuel · exhaust</text>
  </g>
  <g>
    <path d="M665 450 L760 450 L760 515 L665 515Z" class="hall"/>
    <path d="M685 485 L740 485" stroke="#c77d54" stroke-width="7"/>
    <path d="M700 452 L725 430 L750 452" fill="none" stroke="#d6b17b" stroke-width="4"/>
    <text x="650" y="548" class="label">DELIVING WORKS</text><text x="650" y="569" class="sub">Ore seams · shafts · spoil</text>
    <path d="M695 590 L765 610 L835 585" class="ore"/>
  </g>
  <g>
    <path d="M860 515 Q900 475 955 515 L955 585 L860 585Z" class="hall"/>
    <path d="M875 565 Q905 535 940 565" fill="none" stroke="#55b8d2" stroke-width="7"/>
    <text x="840" y="620" class="label">DEEP RESERVOIR</text><text x="840" y="641" class="sub">Storage · distribution · drainage</text>
    <path d="M900 500 L900 550 L940 565 L1010 565" class="water"/>
  </g>
  <g>
    <path d="M1000 520 Q1040 455 1080 520 L1080 590 L1000 590Z" fill="#252e3b" stroke="#9d9a88" stroke-width="3"/>
    <path d="M1015 545 Q1040 510 1065 545" fill="none" stroke="#9d9a88" stroke-width="3"/>
    <text x="1000" y="625" class="label">ROOT HALLS</text><text x="1000" y="646" class="sub">Natural caverns</text>
  </g>
  <g>
    <path d="M510 620 L610 620 L610 695 L510 695Z" fill="url(#deep)" stroke="#7e8791" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M525 638 L595 680 M595 638 L525 680" stroke="#9c6257" stroke-width="4"/>
    <text x="460" y="725" class="label">THE LOWER DARK</text><text x="650" y="725" class="sub">Sealed · unknown · not yet surveyed</text>
  </g>
  <g class="lift">
    <path d="M445 395 V605" stroke="#b7a17c" stroke-width="5" stroke-dasharray="8 8"/>
    <rect x="425" y="480" width="40" height="34" fill="#7a6042" stroke="#ead0a3" stroke-width="2"/>
    <text x="375" y="625" class="sub">Lift shaft</text>
  </g>
  <g transform="translate(30 675)">
    <path d="M0 0 H45" stroke="#d9b77f" stroke-width="6" stroke-dasharray="10 7"/><text x="55" y="5" class="fine">Conceptual circulation</text>
    <path d="M250 0 H295" stroke="#55b8d2" stroke-width="7" stroke-dasharray="12 8"/><text x="305" y="5" class="fine">Water route (illustrative)</text>
    <path d="M520 0 H565" stroke="#c77d54" stroke-width="9" stroke-dasharray="3 7"/><text x="575" y="5" class="fine">Ore seam (illustrative)</text>
  </g>
  <text x="1160" y="744" text-anchor="end" class="fine">SCHEMATIC — NOT GENERATED VOLUME / NOT TO SCALE</text>
</svg>