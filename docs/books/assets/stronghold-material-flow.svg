<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="t d"><title id="t">Material logistics through a stronghold</title><desc id="d">Materials move from deposits through extraction, processing, craft, storage, and trade, with transport and energy constraints at each stage.</desc><rect width="1000" height="310" rx="22" fill="#101923"/><g fill="#1b3b42" stroke="#85ddc6" stroke-width="2"><rect x="25" y="95" width="135" height="100" rx="16"/><rect x="195" y="95" width="135" height="100" rx="16"/><rect x="365" y="95" width="135" height="100" rx="16"/><rect x="535" y="95" width="135" height="100" rx="16"/><rect x="705" y="95" width="120" height="100" rx="16"/><rect x="860" y="95" width="115" height="100" rx="16"/></g><g stroke="#f0ca7b" stroke-width="3" fill="none"><path d="M160 145 H195 M330 145 H365 M500 145 H535 M670 145 H705 M825 145 H860"><animate attributeName="stroke-dashoffset" from="0" to="-35" dur="2s" repeatCount="indefinite"/></path></g><g fill="#edf4f8" font-family="system-ui" text-anchor="middle"><text x="92" y="137" font-size="15">Deposit</text><text x="92" y="158" font-size="11">known resource</text><text x="262" y="137" font-size="15">Extraction</text><text x="262" y="158" font-size="11">labor · access</text><text x="432" y="137" font-size="15">Processing</text><text x="432" y="158" font-size="11">energy · tools</text><text x="602" y="137" font-size="15">Craft</text><text x="602" y="158" font-size="11">skill · design</text><text x="765" y="137" font-size="15">Storage</text><text x="765" y="158" font-size="11">capacity</text><text x="917" y="137" font-size="15">Trade</text><text x="917" y="158" font-size="11">routes</text></g><text x="500" y="245" fill="#a8bbc8" font-family="system-ui" text-anchor="middle" font-size="14">A shortage can originate upstream and become visible far downstream.</text></svg>