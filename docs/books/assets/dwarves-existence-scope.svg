<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Known existence and unknown detail</title><desc id="d">The world can know dwarves exist while leaving their population, culture, and stronghold undisclosed.</desc><rect width="900" height="330" rx="22" fill="#101923"/><g fill="none" stroke="#85ddc6"><circle cx="450" cy="155" r="120" stroke-width="3"><animate attributeName="r" values="116;124;116" dur="5s" repeatCount="indefinite"/></circle><circle cx="450" cy="155" r="83" stroke-width="2" stroke-dasharray="6 8"/><circle cx="450" cy="155" r="42" stroke-width="2"/></g><g fill="#edf4f8" font-family="system-ui" text-anchor="middle"><text x="450" y="151" font-size="22" font-weight="700">Dwarves exist</text><text x="450" y="176" font-size="13">Known world fact</text><text x="450" y="42" font-size="15" fill="#f0ca7b">Possible community</text><text x="450" y="290" font-size="14" fill="#a8bbc8">Population · culture · stronghold · individuals may remain unknown</text></g><path d="M450 70 V105 M450 205 V235" stroke="#f0ca7b" stroke-width="3" stroke-dasharray="4 6"/><circle cx="450" cy="155" r="7" fill="#f0ca7b"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle></svg>