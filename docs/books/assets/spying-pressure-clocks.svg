<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d">
<title id="t">Three pressure clocks in a spying scene</title><desc id="d">Opportunity, suspicion, and response clocks each have four segments. They advance only when the fiction justifies it.</desc>
<rect width="1000" height="330" rx="24" fill="#101923"/>
<g font-family="system-ui" text-anchor="middle" fill="#edf4f8"><text x="170" y="55" font-size="23" font-weight="700">Opportunity</text><text x="500" y="55" font-size="23" font-weight="700">Suspicion</text><text x="830" y="55" font-size="23" font-weight="700">Response</text></g>
<g stroke="#85ddc6" stroke-width="3" fill="#1b303b"><rect x="50" y="95" width="60" height="100" rx="10"/><rect x="120" y="95" width="60" height="100" rx="10"/><rect x="190" y="95" width="60" height="100" rx="10"/><rect x="260" y="95" width="60" height="100" rx="10"/><rect x="380" y="95" width="60" height="100" rx="10"/><rect x="450" y="95" width="60" height="100" rx="10"/><rect x="520" y="95" width="60" height="100" rx="10"/><rect x="590" y="95" width="60" height="100" rx="10"/><rect x="710" y="95" width="60" height="100" rx="10"/><rect x="780" y="95" width="60" height="100" rx="10"/><rect x="850" y="95" width="60" height="100" rx="10"/><rect x="920" y="95" width="60" height="100" rx="10"/></g>
<g fill="#f0ca7b"><rect x="50" y="95" width="60" height="100" rx="10"><animate attributeName="opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/></rect><rect x="450" y="95" width="60" height="100" rx="10"><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></rect><rect x="850" y="95" width="60" height="100" rx="10"><animate attributeName="opacity" values=".4;1;.4" dur="3.4s" repeatCount="indefinite"/></rect></g>
<g fill="#a6bac8" font-family="system-ui" font-size="14" text-anchor="middle"><text x="185" y="240">Window closes</text><text x="515" y="240">Observers notice</text><text x="845" y="240">Opposition acts</text><text x="500" y="290" fill="#f0ca7b">Advance a clock only when the fiction warrants it.</text></g></svg>