<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">A stronghold is a coupled mountain system</title><desc id="d">Geology and water constrain infrastructure; infrastructure supports districts and residents; resident activity changes material demand and maintenance.</desc><rect width="1000" height="400" rx="22" fill="#101923"/><path d="M40 300 L210 105 L330 205 L460 60 L610 220 L760 95 L960 300Z" fill="#293d42" stroke="#85ddc6" stroke-width="3"/><path d="M330 205 L460 60 L610 220" fill="none" stroke="#f0ca7b" stroke-width="4"/><path d="M115 280 Q250 250 340 290 T570 280 T880 280" fill="none" stroke="#6fb8d0" stroke-width="9" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur="4s" repeatCount="indefinite"/></path><g fill="#15232d" stroke="#85ddc6" stroke-width="2"><rect x="160" y="205" width="110" height="70" rx="10"/><rect x="405" y="165" width="130" height="75" rx="10"/><rect x="660" y="210" width="150" height="70" rx="10"/></g><g fill="#edf4f8" font-family="system-ui" text-anchor="middle"><text x="215" y="232" font-size="15">Geology</text><text x="215" y="252" font-size="11">rock · faults</text><text x="470" y="194" font-size="16">Infrastructure</text><text x="470" y="216" font-size="11">air · water · heat</text><text x="735" y="238" font-size="16">Districts</text><text x="735" y="257" font-size="11">homes · work</text></g><path d="M270 240 L405 205 M535 205 L660 240" stroke="#f0ca7b" stroke-width="3" stroke-dasharray="6 7"/><text x="500" y="360" fill="#a8bbc8" font-family="system-ui" font-size="15" text-anchor="middle">A change in one subsystem can propagate through the whole settlement.</text></svg>