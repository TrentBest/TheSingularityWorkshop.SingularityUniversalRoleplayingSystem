<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">NPC domain ownership and SURPS play</title><desc id="d">Singularity City owns the resident ontology and civic data; SURPS composes those residents into encounters, roleplaying procedures, and player or referee interaction.</desc><rect width="900" height="330" rx="22" fill="#101923"/><g fill="#18323d" stroke="#85ddc6" stroke-width="2"><rect x="45" y="85" width="300" height="160" rx="18"/><rect x="555" y="85" width="300" height="160" rx="18"/></g><path d="M345 165 H555" stroke="#f0ca7b" stroke-width="4" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="3s" repeatCount="indefinite"/></path><g fill="#edf4f8" font-family="system-ui" text-anchor="middle"><text x="195" y="128" font-size="21" font-weight="700">Singularity City</text><text x="195" y="157" font-size="14">resident identity</text><text x="195" y="181" font-size="14">relationships · civic context</text><text x="195" y="205" font-size="14">services · location · state</text><text x="705" y="128" font-size="21" font-weight="700">SURPS</text><text x="705" y="157" font-size="14">encounters · roleplaying</text><text x="705" y="181" font-size="14">player / GM procedures</text><text x="705" y="205" font-size="14">story consequences</text></g><text x="450" y="292" fill="#a8bbc8" font-family="system-ui" text-anchor="middle" font-size="14">One authoritative person model; many experiences and portrayals.</text></svg>