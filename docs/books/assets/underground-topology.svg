<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Living underground spatial topology</title>
<desc id="desc">Three chambers are connected by a traversable passage and a ladder. A chasm separates two ledges, with a bridge that changes from intact to broken. Dotted lines indicate visibility, while solid lines indicate spatial connections. The diagram distinguishes adjacency, traversal, and visibility.</desc>
<style>
 text{font-family:system-ui,sans-serif;fill:#edf3f7}.head{font-size:17px;font-weight:700}.sub{font-size:12px;fill:#b9c9d2}.node{fill:#263b47;stroke:#9bc7c5;stroke-width:3}.route{stroke:#8ed7c8;stroke-width:8;stroke-linecap:round;fill:none}.ladder{stroke:#e7c77d;stroke-width:4;fill:none}.sight{stroke:#b5c5d2;stroke-width:2;stroke-dasharray:5 8;fill:none}.bridge{stroke:#e6b56b;stroke-width:9;stroke-linecap:round;stroke-dasharray:12 0;animation:bridge 8s steps(1,end) infinite}.broken{stroke:#e6b56b;stroke-width:8;stroke-linecap:round;stroke-dasharray:13 14;animation:bridge 8s steps(1,end) infinite reverse}@keyframes bridge{0%,49%{opacity:1}50%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.bridge,.broken{animation:none}.broken{opacity:0}.bridge{opacity:1}}
</style>
<rect width="900" height="390" rx="20" fill="#121d27"/>
<path d="M60 265 Q100 190 185 210 Q250 170 315 220 L315 300 H60Z" fill="#344956" stroke="#7f9a9c" stroke-width="3"/>
<path d="M355 270 Q400 205 475 222 Q540 180 595 222 L595 300 H355Z" fill="#344956" stroke="#7f9a9c" stroke-width="3"/>
<path d="M680 260 Q725 190 800 210 Q845 200 875 230 L875 300 H680Z" fill="#344956" stroke="#7f9a9c" stroke-width="3"/>
<path d="M315 252 L355 252" class="route"/>
<path d="M595 252 L680 252" stroke="#8ed7c8" stroke-width="8" stroke-dasharray="7 12" fill="none"/>
<path d="M500 222 L500 108" class="ladder"/>
<path d="M485 125 H515 M485 145 H515 M485 165 H515 M485 185 H515 M485 205 H515" class="ladder"/>
<path d="M185 220 L500 110 L760 220" class="sight"/>
<path d="M595 252 L680 252" class="bridge"/>
<path d="M595 252 L635 232 M650 272 L680 252" class="broken"/>
<path d="M595 300 L680 300" stroke="#e76e6e" stroke-width="3" stroke-dasharray="5 7"/>
<path d="M635 295 L650 305 M650 295 L635 305" stroke="#e76e6e" stroke-width="3"/>
<circle cx="185" cy="248" r="17" class="node"/><circle cx="475" cy="258" r="17" class="node"/><circle cx="760" cy="245" r="17" class="node"/>
<text x="95" y="335" class="head">Chamber A</text><text x="95" y="353" class="sub">natural cavern</text>
<text x="395" y="335" class="head">Chamber B</text><text x="395" y="353" class="sub">vertical access</text>
<text x="705" y="335" class="head">Ledge C</text><text x="705" y="353" class="sub">across a chasm</text>
<text x="355" y="58" class="head">Ladder: traversal capability required</text><text x="355" y="78" class="sub">spatial connection does not guarantee every entity can climb</text>
<text x="45" y="32" class="head">Solid route = traversable connection</text><text x="45" y="50" class="sub">Dotted line = visibility only</text>
<text x="615" y="118" class="head">Bridge state changes</text><text x="615" y="138" class="sub">intact → broken → route unavailable</text>
<text x="28" y="380" class="sub">Conceptual topology · movement, visibility, and perception are resolved separately</text>
</svg>