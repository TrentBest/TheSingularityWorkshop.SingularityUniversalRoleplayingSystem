<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" role="img" aria-labelledby="t d"><title id="t">Dwarven communities are varied networks</title><desc id="d">Individuals and families connect through crafts, organizations, trade, and neighboring communities without assuming one universal culture.</desc><rect width="980" height="370" rx="22" fill="#101923"/><g fill="none" stroke="#85ddc6" stroke-width="3" stroke-opacity=".7"><path d="M490 175 L180 90 M490 175 L490 65 M490 175 L800 90 M490 175 L180 280 M490 175 L800 280"/><path d="M180 90 Q490 -10 800 90 M180 280 Q490 370 800 280" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-64" dur="5s" repeatCount="indefinite"/></path></g><g fill="#1b3b42" stroke="#85ddc6" stroke-width="2"><circle cx="490" cy="175" r="68"/><rect x="90" y="52" width="180" height="76" rx="16"/><rect x="400" y="28" width="180" height="76" rx="16"/><rect x="710" y="52" width="180" height="76" rx="16"/><rect x="90" y="242" width="180" height="76" rx="16"/><rect x="710" y="242" width="180" height="76" rx="16"/></g><g fill="#edf4f8" font-family="system-ui" text-anchor="middle"><text x="490" y="170" font-size="20" font-weight="700">Community</text><text x="490" y="193" font-size="12">many lives, no template</text><text x="180" y="96" font-size="16">Families</text><text x="490" y="72" font-size="16">Crafts</text><text x="800" y="96" font-size="16">Organizations</text><text x="180" y="286" font-size="16">Trade</text><text x="800" y="286" font-size="16">Wider society</text></g><g fill="#f0ca7b"><circle cx="180" cy="90" r="7"><animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/></circle><circle cx="800" cy="280" r="7"><animate attributeName="r" values="9;5;9" dur="2.5s" repeatCount="indefinite"/></circle></g></svg>