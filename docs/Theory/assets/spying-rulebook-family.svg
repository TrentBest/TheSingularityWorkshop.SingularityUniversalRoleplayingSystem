<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Spying rulebook family</title><desc id="desc">CORE spying at LOD 0 is the common baseline. Optional books branch from it: Spying Through History at LOD 1, Cold War Espionage at LOD 2, and Cyberpunk Espionage at LOD 3. Campaigns explicitly select books and scopes.</desc>
<defs><linearGradient id="core" x1="0" x2="1"><stop stop-color="#164e63"/><stop offset="1" stop-color="#0f766e"/></linearGradient><linearGradient id="branch" x1="0" x2="1"><stop stop-color="#263746"/><stop offset="1" stop-color="#1b2835"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#83d6c4"/></marker></defs>
<rect width="1200" height="650" rx="28" fill="#101820"/><text x="600" y="55" fill="#edf3f8" font-family="system-ui,sans-serif" font-size="27" font-weight="700" text-anchor="middle">One subject · selectable campaign treatments</text><text x="600" y="88" fill="#a8b7c6" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">LOD communicates detail. Scope and explicit selection determine applicability.</text>
<g stroke="#83d6c4" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M600 260V315H195V365"/><path d="M600 315H500V365"/><path d="M600 315H805V365"/><path d="M600 315H1050V365"/></g>
<g filter="url(#shadow)"><rect x="390" y="125" width="420" height="135" rx="20" fill="url(#core)" stroke="#83d6c4" stroke-width="2"/><rect x="55" y="365" width="280" height="195" rx="18" fill="url(#branch)" stroke="#83d6c4" stroke-width="1.5"/><rect x="360" y="365" width="280" height="195" rx="18" fill="url(#branch)" stroke="#e9c77b" stroke-width="1.5"/><rect x="665" y="365" width="280" height="195" rx="18" fill="url(#branch)" stroke="#c3a6f2" stroke-width="1.5"/><rect x="970" y="365" width="175" height="195" rx="18" fill="url(#branch)" stroke="#83d6c4" stroke-width="1.5"/></g>
<g font-family="system-ui,sans-serif" text-anchor="middle"><text x="600" y="165" fill="#aaf2df" font-size="14" letter-spacing="2">LOD 0 · CORE</text><text x="600" y="202" fill="#fff" font-size="28" font-weight="700">SPYING</text><text x="600" y="231" fill="#d7e9e8" font-size="15">Shared concepts and playable baseline</text><text x="195" y="410" fill="#aaf2df" font-size="14">LOD 1</text><text x="195" y="448" fill="#fff" font-size="22" font-weight="700">SPYING THROUGH</text><text x="195" y="475" fill="#fff" font-size="22" font-weight="700">HISTORY</text><text x="195" y="515" fill="#b8c7d3" font-size="14">Tradecraft across eras</text><text x="500" y="410" fill="#e9c77b" font-size="14">LOD 2</text><text x="500" y="450" fill="#fff" font-size="22" font-weight="700">COLD WAR</text><text x="500" y="478" fill="#fff" font-size="22" font-weight="700">ESPIONAGE</text><text x="500" y="515" fill="#b8c7d3" font-size="14">Focused historical setting</text><text x="805" y="410" fill="#d6c3ff" font-size="14">LOD 3</text><text x="805" y="450" fill="#fff" font-size="22" font-weight="700">CYBERPUNK</text><text x="805" y="478" fill="#fff" font-size="22" font-weight="700">ESPIONAGE</text><text x="805" y="515" fill="#b8c7d3" font-size="14">Speculative setting</text><text x="1057" y="410" fill="#aaf2df" font-size="14">TABLE</text><text x="1057" y="450" fill="#fff" font-size="19" font-weight="700">CHOOSES</text><text x="1057" y="477" fill="#fff" font-size="19" font-weight="700">SCOPE</text><text x="1057" y="515" fill="#b8c7d3" font-size="13">Not automatic</text></g>
<text x="600" y="615" fill="#a8b7c6" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle">CORE remains the baseline; optional books are selected per campaign and subject.</text></svg>